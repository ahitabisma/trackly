app:
  name: Trackly Backend
  port: 8080
  env: development
  frontend_url: http://localhost:3000

database:
  host: localhost
  port: 5432
  database: trackly
  user: trackly_user
  password: your-secure-password
  max_open_conns: 10
  max_idle_conns: 2
  conn_max_lifetime: 30

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

jwt:
  secret: your-super-secret-jwt-key-change-in-production
  expires_in: 24h # e.g. 1h, 24h, 7d
  audience: trackly-frontend

upload:
  max_size: 5242880 # 5 MB in bytes
  allowed_types:
    - image/jpeg
    - image/png
    - image/webp
  storage_path: ./storage/avatars

rate_limit:
  requests: 100
  window: 60 # seconds

appsscript:
  url: "" # Apps Script Web App URL
  timeout: 30 # HTTP request timeout in seconds
  poll_interval_ms: 500 # polling interval for chart refresh
  poll_max_retries: 20 # max poll attempts (500ms * 20 = 10s total)
  python_script_path: ./scripts/generate_chart.py

nvidia_api_key: "" # NVIDIA NIM API key for AI insight
