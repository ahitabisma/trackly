app:
  port: 3000
  env: development

supabase:
  host: hostname.supabase.co
  port: 5432
  database: postgres
  user: postgres
  password: password
  
redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

jwt:
  secret: your-super-secret-jwt-key-change-in-production
  expires_in: 24h # e.g. 1h, 24h, 7d

upload:
  max_size: 5242880 # 5 MB in bytes
  allowed_types:
    - image/jpeg
    - image/png
    - image/webp
  storage_path: ./storage/avatars

rate_limit:
  requests: 100
  window: 60 # seconds